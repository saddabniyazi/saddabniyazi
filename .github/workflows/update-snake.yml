name: Update Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  update-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate contribution-snake SVG (using npx)
        run: |
          mkdir -p output
          npx -y github-contribution-grid-snake --username saddabniyazi --output output/github-contribution-grid-snake-dark.svg --theme dark || true

      - name: Commit and push SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/github-contribution-grid-snake-dark.svg
          git commit -m "chore: update contribution snake" || echo "No changes to commit"
          git push || echo "Push failed"
